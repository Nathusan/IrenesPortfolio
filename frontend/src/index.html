<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#011627">
    <meta name="description" content="This is my (Irene's) online Portfolio.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
  </head>
  <body>
    <!-- Main application container -->
    <div id="app"></div>

    <!-- Google Analytics Script -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2X9HXZD8R6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-2X9HXZD8R6');
    </script>

    <!-- Main React App entry point -->
    <script type="module" src="./index.tsx"></script>

    <!-- Service Worker Script -->
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(new URL('./components/service-worker.js', import.meta.url))
            .then(registration => {
              console.log('Worker registration successful', registration.scope);
            })
            .catch(err => {
              console.log('Worker registration failed', err);
            });
        });
      } else {
        console.log('Service Worker is not supported by the browser.');
      }
    </script>

  </body>
</html>
